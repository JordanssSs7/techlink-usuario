spring.application.name=backend-spring

# Por defecto usa el puerto 3306. Si tu MySQL usa otro puerto, define la variable DB_URL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/techlink}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# JWT (HU-02): clave de firma (minimo 32 caracteres) por variable de entorno JWT_SECRET. Nunca subirla al repo.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion-minutos=60

# Login con Google (HU-02): Client ID de OAuth creado en Google Cloud Console (no es secreto).
app.google.client-id=${GOOGLE_CLIENT_ID:}
# El secreto SOLO va como variable de entorno GOOGLE_CLIENT_SECRET. Nunca en el repo ni en el grupo.
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
