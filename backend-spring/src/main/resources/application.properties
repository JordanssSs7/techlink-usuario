spring.application.name=backend-spring

# Por defecto usa el puerto 3306. Si tu MySQL usa otro puerto, define la variable DB_URL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/techlink}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Varias personas crean migraciones en paralelo: si una con numero menor se fusiona despues de una mayor, se aplica igual
# en lugar de fallar al arrancar.
spring.flyway.out-of-order=true

# JWT (HU-02): clave de firma (minimo 32 caracteres) por variable de entorno JWT_SECRET. Nunca subirla al repo.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion-minutos=60

# Login con Google (HU-02): Client ID de OAuth creado en Google Cloud Console (no es secreto).
app.google.client-id=${GOOGLE_CLIENT_ID:}
# El secreto SOLO va como variable de entorno GOOGLE_CLIENT_SECRET. Nunca en el repo ni en el grupo.
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Solo para desarrollo: con CUENTAS_PRUEBA=true, una cuenta LOCAL de estudiante o mentor (creada a mano en la base de
# datos, por ejemplo database/03_usuario_prueba_estudiante.sql) puede entrar con correo y contraseña.
# En el sistema real se deja apagado: los alumnos y mentores entran solo con Google.
app.auth.cuentas-de-prueba=${CUENTAS_PRUEBA:false}

# HU-03, HU-13 y HU-18: tamaño máximo de los archivos que se suben (recursos de 10 MB; comprobante de 5 MB y foto de
# 2 MB, que cada servicio valida aparte).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# HU-03: ciclo mínimo para postular a mentor (ciclos avanzados).
app.postulaciones.ciclo-minimo=4

# HU-17: máximo de consultas y respuestas que un usuario puede publicar por hora (contra el spam).
app.foro.max-publicaciones-hora=20
# HU-30: correo al que se escribe si no se encuentra respuesta en el centro de ayuda.
app.ayuda.correo-soporte=${CORREO_SOPORTE:soporte@techlink.edu.pe}

# Agente de IA (HU-04). La clave de Gemini (Google AI Studio, plan gratuito) va SOLO como variable de entorno
# GEMINI_API_KEY: nunca en el codigo ni en Git. Sin clave, el agente funciona con el calculo base.
app.gemini.api-key=${GEMINI_API_KEY:}
# Lista de modelos (separados por coma, en orden de preferencia): se usa el primero que responda. Los nombres cambian y
# la disponibilidad del plan gratuito tambien, por eso se pueden cambiar con GEMINI_MODEL sin tocar el codigo.
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash,gemini-3.5-flash-lite,gemini-flash-lite-latest}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
# Segundos de espera por modelo antes de probar el siguiente.
app.gemini.timeout-segundos=12
# Consultas a la IA por usuario y por hora (protege la cuota gratuita).
app.agente.max-consultas-hora=10
# Mensajes del chat por usuario y por hora.
app.agente.max-mensajes-hora=40

# HU-07: Notificaciones por correo electronico
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Configuracion de seguridad SMTP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Tiempo maximo de espera para evitar bloqueos
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# HU-07: redireccion de correos para pruebas locales
app.sesiones.correo-pruebas=${MAIL_TEST_RECIPIENT:}
